name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and tag
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a stable version like 1.2.3 or push the tag v1.2.3." >&2
            exit 1
          fi
          printf 'version=%s\ntag=v%s\ncommit=%s\n' "$VERSION" "$VERSION" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Rustman iced · Linux binary ───────────────────────────────────────────────
  build-linux-iced:
    name: Build · Rustman iced · Linux ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app has no WebKit/GTK/pdfium dependency, so the same source
          # builds natively on both runner architectures — no cross toolchain
          # or emulation.
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Patch version in Cargo.toml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Patched Cargo.toml to $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libdbus-1-dev \
            pkg-config \
            cmake \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package binary
        # Ship the desktop entry, icon and installer alongside the binary. A
        # bare binary has no icon anywhere in a Linux desktop: Wayland
        # compositors resolve a window's icon by matching its app id against an
        # installed .desktop file, and X11 launchers need one too. Users ran
        # Rustman with the generic placeholder icon because the tarball had
        # nothing to install.
        run: |
          mkdir -p dist/rustman
          cp target/release/rustman dist/rustman/
          cp public/icon.png dist/rustman/
          cp packaging/linux/io.github.animeshchaudhri.rustman.desktop dist/rustman/
          cp packaging/linux/install-desktop-entry.sh dist/rustman/
          chmod +x dist/rustman/install-desktop-entry.sh dist/rustman/rustman
          tar czf rustman-linux-${{ matrix.arch }}.tar.gz -C dist rustman

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: rustman-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ── Rustman iced · macOS universal binary ────────────────────────────────────
  build-macos-iced:
    name: Build · Rustman iced · macOS universal
    needs: prepare
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Patch version in Cargo.toml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Patched Cargo.toml to $VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/rustman \
            target/x86_64-apple-darwin/release/rustman \
            -output rustman-universal

      - name: Build .app bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p Rustman.app/Contents/MacOS
          mkdir -p Rustman.app/Contents/Resources
          cp rustman-universal Rustman.app/Contents/MacOS/rustman

          cat > Rustman.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>rustman</string>
            <key>CFBundleIdentifier</key>
            <string>com.animeshchaudhri.rustman</string>
            <key>CFBundleName</key>
            <string>Rustman</string>
            <key>CFBundleDisplayName</key>
            <string>Rustman</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Convert icon to .icns
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16   16   public/icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32   32   public/icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32   32   public/icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64   64   public/icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128  128  public/icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256  256  public/icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256  256  public/icon.png --out AppIcon.iconset/icon_256x256.png
          iconutil -c icns AppIcon.iconset -o Rustman.app/Contents/Resources/AppIcon.icns

      - name: Package macOS release
        run: |
          mkdir dmg
          mv Rustman.app dmg/
          ln -s /Applications dmg/Applications
          codesign --force --sign - --timestamp=none dmg/Rustman.app
          codesign --verify --deep --strict dmg/Rustman.app
          # The full bundle updates a DMG install. Keep the bare executable
          # first for standalone users and older versions of the updater.
          cp rustman-universal rustman
          COPYFILE_DISABLE=1 tar czf Rustman-macos-universal.tar.gz rustman -C dmg Rustman.app
          hdiutil create -srcfolder dmg -volname Rustman -fs HFS+ -format UDZO Rustman-macos-universal.dmg
          hdiutil verify Rustman-macos-universal.dmg

      - name: Upload macOS release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            Rustman-macos-universal.dmg
            Rustman-macos-universal.tar.gz
          if-no-files-found: error

  # ── Rustman iced · Windows ───────────────────────────────────────────────────
  build-windows-iced:
    name: Build · Rustman iced · Windows ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Patch version in Cargo.toml
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$env:VERSION`"" | Set-Content Cargo.toml
          Write-Host "Patched Cargo.toml to $env:VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package binary
        shell: pwsh
        run: Compress-Archive -Path target\release\rustman.exe -DestinationPath rustman-windows-${{ matrix.arch }}.zip

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: rustman-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: Verify and publish release
    needs: [prepare, build-linux-iced, build-macos-iced, build-windows-iced]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Verify assets and generate SHA256SUMS
        working-directory: assets
        run: |
          set -euo pipefail
          archives=(
            rustman-linux-x86_64.tar.gz
            rustman-linux-aarch64.tar.gz
            Rustman-macos-universal.tar.gz
            Rustman-macos-universal.dmg
            rustman-windows-x86_64.zip
            rustman-windows-aarch64.zip
          )
          for archive in "${archives[@]}"; do
            if [[ ! -s "$archive" ]]; then
              echo "::error::Missing or empty release asset: $archive" >&2
              exit 1
            fi
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Verify tag and release
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          target=$(awk -v tag="refs/tags/$TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled ? peeled : direct) }
          ' <<< "$refs")
          if [[ -n "$target" && "$target" != "$RELEASE_SHA" ]] ||
             [[ "$GITHUB_REF_TYPE" == "tag" && -z "$target" ]]; then
            echo "::error::Tag $TAG does not point to the commit that was built." >&2
            exit 1
          fi
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.draft, .target_commitish] | @tsv")
          if [[ -n "$existing" && "$existing" != $'true\t'"$RELEASE_SHA" ]]; then
            echo "::error::Release $TAG is already published or was drafted from a different commit." >&2
            exit 1
          fi

      - name: Upload all files to a draft release
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: Rustman ${{ needs.prepare.outputs.tag }}
          body: Built from commit [${{ needs.prepare.outputs.commit }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.commit }}).
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/rustman-linux-x86_64.tar.gz
            assets/rustman-linux-aarch64.tar.gz
            assets/Rustman-macos-universal.tar.gz
            assets/Rustman-macos-universal.dmg
            assets/rustman-windows-x86_64.zip
            assets/rustman-windows-aarch64.zip
            assets/SHA256SUMS

      - name: Publish the complete release
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          uploaded=$(gh api "$release" --jq '.assets[] | select(.state == "uploaded") | .name')
          expected=$(awk '{ print $2 }' assets/SHA256SUMS)
          for asset in $expected SHA256SUMS; do
            if ! grep -Fxq "$asset" <<< "$uploaded"; then
              echo "::error::Draft release is missing $asset." >&2
              exit 1
            fi
          done
          gh api --method PATCH "$release" -F draft=false --jq .html_url
